
services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://cinema_user:cinema_password@db:5432/cinema_db
      - SECRET_KEY=dev-secret-key-change-in-production
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_HOST_USER=app2001.mail.noreply@gmail.com
      - EMAIL_HOST_PASSWORD=esikvhqlieilosrs 
      - EMAIL_USE_TLS=true
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - FRONTEND_URL=https://localhost
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    expose:
      - "5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:15-alpine
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cinema_db
      - POSTGRES_USER=cinema_user
      - POSTGRES_PASSWORD=cinema_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_user -d cinema_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cinema_postgres_data:
  caddy_data:
  caddy_config:
